name: Host tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S test/host -B test/host/build

      - name: Build
        run: cmake --build test/host/build

      - name: Run
        working-directory: test/host/build
        run: ctest --output-on-failure
