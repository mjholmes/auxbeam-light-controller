repository: "https://github.com/mjholmes/auxbeam-light-controller.git"
documentation: "https://github.com/mjholmes/auxbeam-light-controller#readme"
issues: "https://github.com/mjholmes/auxbeam-light-controller/issues"
license: "Apache-2.0"
targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
dependencies:
  idf: ">=5.0"
